[workspace]
name = "strait-of-hormuz-demo"
version = "0.1.0"
description = "Adaptive scenario probability framework for a Strait of Hormuz crisis (BN demo)."
authors = ["Francesco Muia <francesco.muia@ai-and-analytics-solutions.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
graphviz = ">=9"  # system binary used by the python graphviz wrapper
nbformat = ">=5.10.4,<6"
nbclient = ">=0.10.4,<0.11"
ipykernel = ">=7.2.0,<8"
jupyterlab = ">=4.5.8,<5"

[pypi-dependencies]
pgmpy = ">=0.1.26"
streamlit = ">=1.45,<2"
networkx = ">=3.3,<4"
matplotlib = ">=3.9,<4"
pandas = ">=2.2,<3"
numpy = ">=1.26,<3"
pytest = ">=8.3,<9"
openai = ">=1.54,<2"
claude-agent-sdk = ">=0.1.0"
graphviz = ">=0.20,<1"
streamlit-agraph = ">=0.0.45"
altair = ">=5.0,<6"

[tasks]
test = "pytest -q"
app = "streamlit run app/dashboard.py"
derive-anchors = "python scripts/derive_latent_regime_anchors.py"
compare = "python scripts/compare_topologies.py"
notebook = "python scripts/build_comparison_notebook.py"
translator-eval = "python scripts/translator_eval.py"
lab = "jupyter lab"
